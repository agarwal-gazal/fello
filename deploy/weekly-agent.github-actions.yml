# Free alternative to a Render cron job. Copy to .github/workflows/weekly-agent.yml in the repository, then add the repository secret
# DATABASE_URL (Settings -> Secrets and variables -> Actions -> New repository secret) holding the OWNER connection string.
name: weekly-agent
on:
  schedule:
    - cron: "0 1 * * 1"            # Mondays 01:00 UTC. GitHub may delay scheduled runs by several minutes; the agent skips Mondays already done.
  workflow_dispatch: {}             # lets you press "Run workflow" by hand to prove it works
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r deploy/requirements.txt
      - run: python -m agent.scheduler --once --now wall --catch-up 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
